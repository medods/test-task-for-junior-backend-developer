services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_create_tasks.up.sql:/docker-entrypoint-initdb.d/001_create_tasks.sql:ro
      - ./migrations/0002_add_periodicity_to_tasks.up.sql:/docker-entrypoint-initdb.d/002_add_periodicity.sql:ro
      - ./migrations/0003_add_scheduled_for_to_tasks.up.sql:/docker-entrypoint-initdb.d/003_create_task_schedule.sql:ro
      - ./migrations/0004_add_parent_id_and_indexes.up.sql:/docker-entrypoint-initdb.d/004_add_parent_id.sql:ro
      - ./migrations/0005_add_last_run_at.up.sql:/docker-entrypoint-initdb.d/005_add_last_run.sql:ro
      - ./migrations/0006_add_unique_constraint.up.sql:/docker-entrypoint-initdb.d/006_add_unique_constaint.sql:ro
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/taskservice?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
